modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="MSpell"
description='''
Compatibility integrations for Flowing Fluids, Simple Clouds, Legendary Survival Overhaul, Burnt Basic and Sable.
'''

[[mixins]]
config="mspellcompat.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2.0)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="flowing_fluids"
type="optional"
versionRange="[1.0.8,2.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simpleclouds"
type="optional"
versionRange="[0.7.3+1.21.1,1.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="legendarysurvivaloverhaul"
type="optional"
versionRange="[2.4.7.2,3.0.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
