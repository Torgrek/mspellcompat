def modrinthFileDependency = { artifact ->
    files(artifact.file).builtBy(artifact.task)
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly 'org.spongepowered:mixin:0.8.7'

    compileOnly modrinthFileDependency(modrinthArtifacts.flowingFluids)
    localRuntime modrinthFileDependency(modrinthArtifacts.flowingFluids)

    compileOnly modrinthFileDependency(modrinthArtifacts.simpleClouds)
    localRuntime modrinthFileDependency(modrinthArtifacts.simpleClouds)

    compileOnly modrinthFileDependency(modrinthArtifacts.lso)
    localRuntime modrinthFileDependency(modrinthArtifacts.lso)

    compileOnly modrinthFileDependency(modrinthArtifacts.clothConfig)
    localRuntime modrinthFileDependency(modrinthArtifacts.clothConfig)

    compileOnly modrinthFileDependency(modrinthArtifacts.burntBasic)
    localRuntime modrinthFileDependency(modrinthArtifacts.burntBasic)

    localRuntime modrinthFileDependency(modrinthArtifacts.modularBackpacks)
    localRuntime modrinthFileDependency(modrinthArtifacts.create)
    localRuntime modrinthFileDependency(modrinthArtifacts.createAeronautics)
    localRuntime modrinthFileDependency(modrinthArtifacts.sable)
    localRuntime modrinthFileDependency(modrinthArtifacts.sableBeyond)
    localRuntime modrinthFileDependency(modrinthArtifacts.treePhysics)
}

def allModrinthDownloadTasks = modrinthArtifacts.values().collect { it.task }
allModrinthDownloadTasks.each { downloadTask ->
    downloadTask.configure { mustRunAfter tasks.named('clean') }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData'] }.configureEach {
    dependsOn allModrinthDownloadTasks
}


def simpleCloudsApiJar = layout.buildDirectory.file('generated/compileOnly/simplecloudsapi-neoforge-1.4-1.21.1.jar')

tasks.register('extractSimpleCloudsApi') {
    dependsOn modrinthArtifacts.simpleClouds.task
    inputs.file(modrinthArtifacts.simpleClouds.file)
    outputs.file(simpleCloudsApiJar)
    doLast {
        File sourceJar = modrinthArtifacts.simpleClouds.file.get().asFile
        def entryName = 'META-INF/jarjar/simplecloudsapi-neoforge-1.4-1.21.1.jar'
        def zip = new java.util.zip.ZipFile(sourceJar)
        try {
            def entry = zip.getEntry(entryName)
            if (entry == null) {
                throw new GradleException("Simple Clouds artifact is missing ${entryName}")
            }
            def outputJar = simpleCloudsApiJar.get().asFile
            outputJar.parentFile.mkdirs()
            zip.getInputStream(entry).withCloseable { input ->
                outputJar.withOutputStream { output -> input.transferTo(output) }
            }
        } finally {
            zip.close()
        }
    }
}

sourceSets.main.compileClasspath += files(simpleCloudsApiJar).builtBy(tasks.named('extractSimpleCloudsApi'))
tasks.named('compileJava') {
    dependsOn tasks.named('extractSimpleCloudsApi')
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('processResources') {
    from('LICENSE') {
        into 'META-INF/licenses'
        rename { 'LICENSE-MSpellCompat.txt' }
    }
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF/licenses'
    }
}

jar {
    manifest.attributes([
            'MixinConfigs': 'mspellcompat.mixins.json'
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:unchecked', '-Xlint:deprecation']
}
