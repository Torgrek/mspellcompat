plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

def sha256For = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def registerModrinthCdnArtifact = { String taskSuffix, String projectId, String versionId, String fileName, String expectedSha256, String customUrl ->
    def targetFile = layout.buildDirectory.file("downloaded-mods/${fileName}")
    def downloadUrl = customUrl ?: "https://cdn.modrinth.com/data/${projectId}/versions/${versionId}/${fileName}"
    def downloadTask = tasks.register("download${taskSuffix}", DefaultTask) {
        inputs.property('downloadUrl', downloadUrl)
        inputs.property('expectedSha256', expectedSha256)
        outputs.file(targetFile)
        outputs.upToDateWhen {
            File currentFile = targetFile.get().asFile
            currentFile.isFile() && sha256For(currentFile) == expectedSha256
        }
        doLast {
            File target = targetFile.get().asFile
            if (target.isFile() && sha256For(target) == expectedSha256) {
                return
            }

            target.parentFile.mkdirs()
            File temporary = new File(target.parentFile, target.name + '.part')
            temporary.delete()
            def connection = new URL(downloadUrl).openConnection()
            connection.connectTimeout = 20000
            connection.readTimeout = 120000
            connection.setRequestProperty('User-Agent', 'MSpellCompat-Gradle/0.1.0')
            try {
                if (connection instanceof java.net.HttpURLConnection) {
                    connection.instanceFollowRedirects = true
                    int status = connection.responseCode
                    if (status < 200 || status >= 300) {
                        throw new GradleException("Modrinth CDN returned HTTP ${status} for ${fileName}")
                    }
                }
                connection.inputStream.withCloseable { input ->
                    temporary.withOutputStream { output -> input.transferTo(output) }
                }
            } catch (Exception exception) {
                temporary.delete()
                throw new GradleException("Failed to download ${fileName} from Modrinth CDN: ${exception.message}", exception)
            } finally {
                if (connection instanceof java.net.HttpURLConnection) {
                    connection.disconnect()
                }
            }

            String actualSha256 = sha256For(temporary)
            if (actualSha256 != expectedSha256) {
                temporary.delete()
                throw new GradleException("SHA-256 mismatch for ${fileName}: expected ${expectedSha256}, got ${actualSha256}")
            }
            java.nio.file.Files.move(
                    temporary.toPath(),
                    target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }
    }
    [file: targetFile, task: downloadTask, projectId: projectId, versionId: versionId,
     fileName: fileName, sha256: expectedSha256, url: downloadUrl]
}

